<div class="chat-container">
  <header class="chat-header">
    <img [src]="myTestLoaded()?.urlPhoto" alt="profile" />
    <span>{{ myTestLoaded()?.participant_name! | capitalizePipe }}</span>

    <button class="back-arrow" (click)="navigateToOrigin()">🔙</button>
  </header>
  <main class="chat-main">
    @for (message of myTestLoaded()?.messages; track message.id) {
      @if (message.sender_id !== '96') {
        <div class="message received">{{ message.content }}</div>
      } @else {
        <div class="message sent">{{ message.content }}</div>
      }
    }
    @if (isDotsActiveChat() === this.client.myConversationId()) {
      <app-dots-chats />
    }
  </main>

  <footer class="chat-footer">
    <input class="input-chat" placeholder="Type Message" [(ngModel)]="text" />
    <button (click)="sendMessage(myTestLoaded()?.conversation_id || null)">Send</button>
  </footer>
</div>
