<div class="search-container">
  <div class="search-input-wrapper" (click)="handleSearchContact()">
    <span class="search-icon">🔍</span>
    <input
      type="text"
      [(ngModel)]="text"
      placeholder="Search or start new chat"
      class="search-input"
    />
  </div>
</div>
<main class="messages-content">
  <section class="tiles-section">
    <div>
      @for (contact of myContacsLoaded(); track contact.conversation_id) {
        <app-send-message [contact]="contact" />
      }
    </div>
  </section>
</main>
<footer className="sidebar-footer">
  <button class="add-contact-btn" title="Add new contact" (click)="navigateToForm()">👤+</button>
</footer>
