@if (!contact) {
  <div>Contact Not Found</div>
} @else {
  <div class="message-tile" (click)="onClick(contact.conversation_id)">
    <img src="https://i.pravatar.cc/300?u=15" class="tile-avatar" width="50" height="50" alt="" />
    <div class="tile-info">
      <div class="tile-header">
        <h4 class="tile-name">{{ contact.participant_name | capitalizePipe }}</h4>
        <span class="tile-time">{{ contact.last_message_time | date: 'medium' }}</span>
      </div>
      <p class="tile-message">{{ contact.last_message || 'No messages yet' }}</p>
    </div>
  </div>
}
